name: Backend Keep-Alive
on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin-down (inactivity timeout is 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          TARGET_URL="${{ secrets.API_HEALTH_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://api.thelastdeploy.com/health"
          fi
          echo "Pinging health endpoint: $TARGET_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL")
          echo "HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✓ Backend is warm and healthy"
          else
            echo "⚠️ Health check returned status $RESPONSE (Backend might be waking up or DNS propagating)"
          fi
