name: Cut CLI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.3)"
        required: true
        type: string
      also_update_stable:
        description: "Also move the stable tag to this version?"
        required: false
        type: boolean
        default: false

jobs:
  cut-release:
    name: Cut ${{ inputs.version }} from latest
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: ${{ inputs.version }}"
            echo "   Expected format: v1.0.3"
            exit 1
          fi
          echo "✓ Version format OK: ${{ inputs.version }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build Release Artifacts
        run: make dist VERSION=${{ inputs.version }}

      - name: Get current commit SHA
        id: commit_info
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ inputs.version }} \
            dist/tld-* \
            dist/checksums.txt \
            --title "tld cli ${{ inputs.version }}" \
            --notes "Release **${{ inputs.version }}** built from \`main\` by **${{ github.actor }}**.

          **Source commit:** \`${{ steps.commit_info.outputs.sha }}\`
          **Released at:** $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Also update stable (if requested)
        if: inputs.also_update_stable == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Moving stable → ${{ inputs.version }}"

          gh release delete stable --yes --cleanup-tag 2>/dev/null || true

          gh release create stable \
            dist/tld-* \
            dist/checksums.txt \
            --title "tld cli: stable" \
            --notes "Stable release pinned to **${{ inputs.version }}** by **${{ github.actor }}**.

          **Source commit:** \`${{ steps.commit_info.outputs.sha }}\`
          **Promoted at:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest
