name: Promote CLI to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag this promotion corresponds to (e.g. v1.2.0) — used to stamp binaries correctly"
        required: true
        type: string

jobs:
  promote:
    name: Promote ${{ inputs.version }} → stable
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: ${{ inputs.version }}"
            echo "   Expected format: v1.2.0"
            exit 1
          fi
          echo "✓ Version format OK: ${{ inputs.version }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build Release Artifacts
        run: make dist VERSION=${{ inputs.version }}

      - name: Get current commit SHA
        id: commit_info
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Delete existing stable release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete stable --yes --cleanup-tag 2>/dev/null || true

      - name: Publish stable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create stable \
            dist/tld-* \
            dist/checksums.txt \
            --title "tld cli: stable" \
            --notes "Stable release promoted to **${{ inputs.version }}** by **${{ github.actor }}**.

          **Source commit:** \`${{ steps.commit_info.outputs.sha }}\`
          **Promoted at:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest
