id: lnx-search-by-file-properties
title: "Search files by size and properties"
xp: 20
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "rm -rf $HOME/search-test"
    - "mkdir -p $HOME/search-test/logs"
    - "truncate -s 500k $HOME/search-test/logs/app.log"
    - "truncate -s 10M $HOME/search-test/logs/oversized.log"
    - "truncate -s 2M $HOME/search-test/logs/db.log"
version: 1
