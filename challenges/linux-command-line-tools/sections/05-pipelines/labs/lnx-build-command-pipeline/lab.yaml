id: lnx-build-command-pipeline
title: Build a multi-stage command pipeline
xp: 30
setup:
  seed_commands:
  - rm -rf $HOME/pipe-test
  - mkdir -p $HOME/pipe-test
  - echo '10.0.0.1 - - [01/Jan/2026] 'GET /index.html HTTP/1.1' 200' > $HOME/pipe-test/access.log
  - echo '10.0.0.99 - - [01/Jan/2026] 'POST /login HTTP/1.1' 200' >> $HOME/pipe-test/access.log
  - echo '10.0.0.2 - - [01/Jan/2026] 'GET /about HTTP/1.1' 200' >> $HOME/pipe-test/access.log
  - echo '10.0.0.99 - - [01/Jan/2026] 'POST /api/data HTTP/1.1' 200' >> $HOME/pipe-test/access.log
  - echo '10.0.0.99 - - [01/Jan/2026] 'POST /logout HTTP/1.1' 200' >> $HOME/pipe-test/access.log
  - echo '10.0.0.1 - - [01/Jan/2026] 'POST /feedback HTTP/1.1' 200' >> $HOME/pipe-test/access.log
