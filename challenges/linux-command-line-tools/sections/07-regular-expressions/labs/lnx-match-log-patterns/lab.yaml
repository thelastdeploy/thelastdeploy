id: lnx-match-log-patterns
title: Match IPv4 addresses using extended regex
xp: 25
setup:
  seed_commands:
  - rm -rf $HOME/regex-test
  - mkdir -p $HOME/regex-test
  - echo 'Connection from 10.0.0.1 established' > $HOME/regex-test/network.log
  - echo 'Failed login from 192.168.1.1' >> $HOME/regex-test/network.log
  - echo 'Connection from 10.0.0.42 accepted' >> $HOME/regex-test/network.log
  - echo 'Connection from 10.255.0.99 closed' >> $HOME/regex-test/network.log
  - echo 'Invalid IP 999.999.999.999 ignored' >> $HOME/regex-test/network.log
version: 2
