id: lnx-recover-broken-environment
title: Recover broken package management environment
xp: 50
setup:
  seed_commands:
  - rm -rf $HOME/pkg-challenge
  - mkdir -p $HOME/pkg-challenge/locks
  - touch $HOME/pkg-challenge/locks/frontend.lock
  - 'echo ''Package: nginx Status: installed'' > $HOME/pkg-challenge/status.log'
  - 'echo ''Package: app-service Status: half-configured'' >> $HOME/pkg-challenge/status.log'
