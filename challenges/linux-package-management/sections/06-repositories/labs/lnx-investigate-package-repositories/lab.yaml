id: lnx-investigate-package-repositories
title: "Inspect repository source configurations"
xp: 30
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "rm -rf $HOME/repo-test"
    - "mkdir -p $HOME/repo-test"
    - "echo 'deb http://archive.ubuntu.com/ubuntu focal main universe' > $HOME/repo-test/sources.list"
    - "echo 'deb http://archive.ubuntu.com/ubuntu focal-updates main universe' >> $HOME/repo-test/sources.list"
version: 1
