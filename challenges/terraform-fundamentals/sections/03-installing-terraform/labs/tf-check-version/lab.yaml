id: tf-check-version
title: Verify Terraform Version
xp: 10
estimated_minutes: 3
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which terraform || (curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip && unzip -qo /tmp/tf.zip -d /usr/local/bin && rm -f /tmp/tf.zip)"
    - echo 'Verifying that the installed version of Terraform works.'
version: 2
