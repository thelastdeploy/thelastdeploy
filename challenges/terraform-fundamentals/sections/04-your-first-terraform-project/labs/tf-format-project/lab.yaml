id: tf-format-project
title: Format Your Terraform Configurations
xp: 15
estimated_minutes: 3
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which terraform || (curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip && unzip -qo /tmp/tf.zip -d /usr/local/bin && rm -f /tmp/tf.zip)"
    - rm -rf $HOME/terraform-challenge
    - mkdir -p $HOME/terraform-challenge
    - echo 'provider   "local"   {}' > $HOME/terraform-challenge/main.tf
    - echo 'resource "local_file" "example" {' >> $HOME/terraform-challenge/main.tf
    - echo 'content = "hello"' >> $HOME/terraform-challenge/main.tf
    - echo 'filename = "out.txt"' >> $HOME/terraform-challenge/main.tf
    - echo '}' >> $HOME/terraform-challenge/main.tf
version: 2
