id: git-configure-gitignore
title: Configure Git Ignore List
order: 1
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
    - rm -rf $HOME/git-challenge
    - mkdir -p $HOME/git-challenge
    - git -C $HOME/git-challenge init -b main
    - rm -f $HOME/git-challenge/.gitignore
version: 2
