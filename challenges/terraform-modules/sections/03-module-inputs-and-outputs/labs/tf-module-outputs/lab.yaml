id: tf-module-outputs
title: Access Output Values from a Module
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-modules-challenge
    - mkdir -p $HOME/terraform-modules-challenge/modules/file_writer
    - echo 'resource "local_file" "out" {' > $HOME/terraform-modules-challenge/modules/file_writer/main.tf
    - echo '  content  = "hello"' >> $HOME/terraform-modules-challenge/modules/file_writer/main.tf
    - echo '  filename = "/tmp/out.txt"' >> $HOME/terraform-modules-challenge/modules/file_writer/main.tf
    - echo '}' >> $HOME/terraform-modules-challenge/modules/file_writer/main.tf
    - echo 'output "file_path" {' > $HOME/terraform-modules-challenge/modules/file_writer/outputs.tf
    - echo '  value = local_file.out.filename' >> $HOME/terraform-modules-challenge/modules/file_writer/outputs.tf
    - echo '}' >> $HOME/terraform-modules-challenge/modules/file_writer/outputs.tf
    - echo 'module "writer" {' > $HOME/terraform-modules-challenge/main.tf
    - echo '  source = "./modules/file_writer"' >> $HOME/terraform-modules-challenge/main.tf
    - echo '}' >> $HOME/terraform-modules-challenge/main.tf
version: 2
