id: tf-refactor-project
title: Refactor Monolithic Project into Modules
xp: 30
estimated_minutes: 10
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-modules-challenge
    - mkdir -p $HOME/terraform-modules-challenge
    - echo 'resource "local_file" "f1" {' > $HOME/terraform-modules-challenge/main.tf
    - echo '  content  = "1"' >> $HOME/terraform-modules-challenge/main.tf
    - echo '  filename = "/tmp/f1.txt"' >> $HOME/terraform-modules-challenge/main.tf
    - echo '}' >> $HOME/terraform-modules-challenge/main.tf
    - echo 'resource "local_file" "f2" {' >> $HOME/terraform-modules-challenge/main.tf
    - echo '  content  = "2"' >> $HOME/terraform-modules-challenge/main.tf
    - echo '  filename = "/tmp/f2.txt"' >> $HOME/terraform-modules-challenge/main.tf
    - echo '}' >> $HOME/terraform-modules-challenge/main.tf
version: 2
