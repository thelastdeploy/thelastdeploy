id: lnx-investigate-suspicious-process
title: "Investigate Suspicious Processes and Backdoors"
xp: 40
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "mkdir -p $HOME/sec-test"
    - "printf 'PID USER COMMAND\n1001 root nginx\n2045 guest nc -l -p 4444 -e /bin/bash\n3012 db postgres\n' > $HOME/sec-test/proc_snapshot.txt"
