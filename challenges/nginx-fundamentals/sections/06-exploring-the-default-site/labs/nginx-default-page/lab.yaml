id: nginx-default-page
title: "Modify Default Site Page"
order: 1
xp: 30
estimated_minutes: 10
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
    - "sudo systemctl start nginx || true"
    - "sudo mkdir -p /var/www/html"
    - "if [ ! -f /var/www/html/index.html ]; then echo 'Welcome to Nginx' | sudo tee /var/www/html/index.html > /dev/null; fi"
version: 2
