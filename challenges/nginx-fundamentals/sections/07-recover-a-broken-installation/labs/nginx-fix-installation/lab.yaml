id: nginx-fix-installation
title: "Fix Broken Installation"
order: 1
xp: 50
estimated_minutes: 15
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
    - "which nginx || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - "sudo sed -i 's/listen 80 default_server;/listen 80 default_server; broken_syntax_here/' /etc/nginx/sites-available/default"
    - "sudo systemctl stop nginx || true"
version: 2
