id: lnx-inspect-disk-partitions
title: "Inspect Disk Partition Tables"
xp: 25
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "mkdir -p $HOME/storage-test"
    - "printf 'Disk /dev/sdb: 20 GiB, 21474836480 bytes\nDevice     Boot Start      End  Sectors Size Id Type\n/dev/sdb1        2048 20971519 20969472  10G 83 Linux\n/dev/sdb2    20971520 41943039 20971520  10G 83 Linux\n' > $HOME/storage-test/fdisk_dump.txt"
    - "rm -f $HOME/storage-test/partition_info.txt"
version: 1
