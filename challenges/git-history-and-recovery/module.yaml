id: git-history-and-recovery
title: Git History & Recovery
description: Master Git history. Understand the detached HEAD state, perform resets
  (soft, mixed, hard), revert commits, locate lost commits using the reflog, and recover
  deleted branches.
topic: git
difficulty: intermediate
estimated_minutes: 80
tags:
- git
- history
- reset
- revert
- reflog
- recovery
verified: true
version: 1
shared_seed:
  - "which git >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git)"
  - "git config --global user.name 'TheLastDeploy Student'"
  - "git config --global user.email 'student@thelastdeploy.com'"
  - "git config --global init.defaultBranch main"
  - "git config --global pull.rebase false"


