id: nginx-production-outage
title: "Recover Production Outage"
xp: 30
estimated_minutes: 10
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo systemctl stop nginx || true"
    - "sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; s=open(p).read(); parts=s.split(\"default_server\"); open(p,\"w\").write(parts[0]+\"default_server\"+\"\".join(parts[1:]))"'
    # Seed bug 1: Missing semicolon in nginx.conf (after keepalive_timeout)
    - "sudo sed -i '/http {/a \\    keepalive_timeout 65' /etc/nginx/nginx.conf"
    # Seed bug 2 & 3: Duplicate default_server and invalid proxy_pass scheme
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /outage {\\n        proxy_pass ht://127.0.0.1:8080;\\n    }\"))"'
    - "echo -e '\nserver {\n    listen 80 default_server;\n    server_name broken.local;\n}' | sudo tee -a /etc/nginx/sites-available/default > /dev/null"
version: 2
