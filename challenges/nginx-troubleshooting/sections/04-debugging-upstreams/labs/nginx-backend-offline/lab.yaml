id: nginx-backend-offline
title: "Start Offline Backend"
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - "sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true"
    # Create the upstream definition in nginx.conf
    - "sudo sed -i '/upstream app_servers/,+3d' /etc/nginx/nginx.conf || true"
    - "sudo sed -i '/http {/a \\    upstream app_servers { server 127.0.0.1:8081; }' /etc/nginx/nginx.conf"
    # Ensure /app location block exists in default
    - "sudo sed -i '/location \\/app/,+3d' /etc/nginx/sites-available/default || true"
    - "sudo sed -i '/server_name _;/a \\    location /app { proxy_pass http://app_servers; }' /etc/nginx/sites-available/default"
    # Ensure any active python servers on 8081 are killed
    - "sudo kill -9 $(sudo lsof -t -i:8081) &>/dev/null || true"
    # Create the helper start_backend.sh script
    - "rm -rf /tmp/backend-static && mkdir -p /tmp/backend-static && echo 'BACKEND LIVE' | tee /tmp/backend-static/index.html /tmp/backend-static/app > /dev/null"
    - 'python3 -c "open(\"/tmp/start_backend.sh\",\"w\").write(\"#!/bin/bash\\nnohup python3 -m http.server 8081 --directory /tmp/backend-static >/dev/null 2>&1 &\\n\")"'
    - "chmod +x /tmp/start_backend.sh"
    - "sudo systemctl start nginx || true"
    - "sudo systemctl restart nginx || true"
version: 2
