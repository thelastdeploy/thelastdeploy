id: nginx-fix-403
title: "Fix a 403 Forbidden Error"
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo systemctl start nginx || true"
    - "sudo mkdir -p /var/www/html && echo '<h1>Welcome</h1>' | sudo tee /var/www/html/index.html > /dev/null && sudo chmod 000 /var/www/html/index.html"
version: 2
