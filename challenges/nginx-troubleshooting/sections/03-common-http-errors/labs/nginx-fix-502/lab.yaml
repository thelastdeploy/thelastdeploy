id: nginx-fix-502
title: "Fix a 502 Bad Gateway Error"
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    # Ensure any active python servers on 8080 are killed
    - "sudo kill -9 $(sudo lsof -t -i:8080) &>/dev/null || true"
    # Start a mock python http server in background on port 8080
    - "mkdir -p /tmp/mock-backend && echo 'API OK' > /tmp/mock-backend/index.html && echo 'API OK' > /tmp/mock-backend/api"
    - "nohup python3 -m http.server 8080 --directory /tmp/mock-backend >/dev/null 2>&1 &"
    # Inject bad proxy pass (9090 instead of 8080) to /api block
    - "sudo sed -i '/location \\/api/,+3d' /etc/nginx/sites-available/default || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /api {\\n        proxy_pass http://127.0.0.1:9090;\\n    }\"))"'
    - "sudo systemctl start nginx || true"
    - "sudo systemctl restart nginx || true"
version: 2
