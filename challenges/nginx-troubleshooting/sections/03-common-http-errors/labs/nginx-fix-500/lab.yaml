id: nginx-fix-500
title: "Fix a 500 Internal Server Error"
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - "echo 'OK' | sudo tee /var/www/html/index.html > /dev/null"
    # Inject a rewrite loop under a location /loop block
    - "sudo sed -i '/location \\/loop/,+4d' /etc/nginx/sites-available/default || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /loop {\\n        rewrite ^/loop$ /loop1;\\n        rewrite ^/loop1$ /loop;\\n    }\"))"'
    - "sudo systemctl start nginx || true"
    - "sudo systemctl restart nginx || true"
version: 2
