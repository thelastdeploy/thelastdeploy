id: nginx-include-config
title: "Include Config"
order: 1
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
    - "sudo mkdir -p /etc/nginx/snippets /etc/nginx/sites-available"
    - "echo 'add_header X-Custom-Header \"TheLastDeploy\";' | sudo tee /etc/nginx/snippets/custom-headers.conf > /dev/null"
    - "sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
version: 2
