id: lnx-create-and-restore-lvm-snapshot
title: Create and Restore LVM Snapshots
xp: 45
setup:
  seed_commands:
  - mkdir -p $HOME/snap-test
  - rm -f $HOME/snap-test/snap_summary.txt
instructions: '1. Create directory `$HOME/snap-test`.
2. Document snapshot creation (`lvcreate -s`) and merge rollback syntax (`lvconvert --merge`).
3. Write output summary line `LVM_SNAPSHOT_PROCEDURE_VERIFIED` to `$HOME/snap-test/snap_summary.txt`.'
version: 1
