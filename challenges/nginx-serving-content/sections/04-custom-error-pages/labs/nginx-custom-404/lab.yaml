id: nginx-custom-404
title: "Configure Custom 404 Page"
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - "sudo rm -f /var/www/html/404.html"
    - "sudo systemctl start nginx || true"
version: 2
