id: k8s-recover-failed-update
title: "Recover Stuck Rollout"
order: 2
xp: 35
estimated_minutes: 5
environment:
  profile: tld-kind
setup:
  seed_commands:
    - 'until kubectl get serviceaccount default --context=kind-tld-k8s-recover-failed-update &>/dev/null; do sleep 1; done'
    - 'echo -e "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: rollout-app\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: rollout-app\n  template:\n    metadata:\n      labels:\n        app: rollout-app\n    spec:\n      containers:\n      - name: rollout-app\n        image: nginx:1.161.typo" | kubectl apply --context=kind-tld-k8s-recover-failed-update -f -'
version: 2
