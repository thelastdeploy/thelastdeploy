id: k8s-investigate-resources
title: "Investigate Cluster Pods"
order: 1
xp: 30
estimated_minutes: 5
environment:
  profile: tld-kind
setup:
  seed_commands:
    - "mkdir -p $HOME/k8s-troubleshooting"
    - "rm -f $HOME/k8s-troubleshooting/kube-system-pods.txt"
    - 'until kubectl get serviceaccount default --context=kind-tld-k8s-investigate-resources &>/dev/null; do sleep 1; done'
    - 'until kubectl get pods -n kube-system -l k8s-app=kube-dns --context=kind-tld-k8s-investigate-resources 2>/dev/null | grep -q coredns; do sleep 1; done'
version: 2
