id: nginx-fix-reverse-proxy
title: "Fix Broken Reverse Proxy"
xp: 40
estimated_minutes: 10
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    # Append broken location rule to the default site config
    - "sudo sed -i '/location \\/api/,+3d' /etc/nginx/sites-available/default || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /api {\\n        proxy_pass 127.0.0.1:8080;\\n    }\"))"'
    - "sudo systemctl stop nginx || true"
version: 2
