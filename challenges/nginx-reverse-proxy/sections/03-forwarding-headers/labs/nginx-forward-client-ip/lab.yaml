id: nginx-forward-client-ip
title: "Forward Client IP"
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    # Ensure default has /node block
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    - "sudo sed -i '/location \\/node/,+3d' /etc/nginx/sites-available/default || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /node {\\n        proxy_pass http://127.0.0.1:3000;\\n    }\"))"'
    - "sudo systemctl start nginx || true"
    - "sudo systemctl restart nginx || true"
version: 2
