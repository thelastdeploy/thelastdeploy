id: lnx-connect-to-remote-host
title: Connect to a Remote Host via SSH
xp: 15
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p $HOME/ssh-test
  - rm -f $HOME/ssh-test/connect.sh
instructions: '1. Create directory `$HOME/ssh-test`.
2. Create an executable script `$HOME/ssh-test/connect.sh` containing an SSH connection command to user `admin` at remote host `10.0.0.50`.
3. Ensure the script has executable permissions (`chmod +x`).'
version: 3
