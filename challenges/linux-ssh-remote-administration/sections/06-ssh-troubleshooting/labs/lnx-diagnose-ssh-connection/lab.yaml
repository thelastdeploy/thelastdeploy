id: lnx-diagnose-ssh-connection
title: Diagnose Connection Failures with Verbose Mode
xp: 30
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p $HOME/ssh-test
  - rm -f $HOME/ssh-test/debug_cmd.sh
instructions: '1. Create directory `$HOME/ssh-test`.
2. Create an executable script `$HOME/ssh-test/debug_cmd.sh` that invokes `ssh` with level 3 verbosity (`-vvv`).
3. Ensure the script has executable permissions (`chmod +x`).'
version: 3
