id: lnx-perform-remote-maintenance
title: Perform Automated Remote Maintenance
xp: 40
setup:
  seed_commands:
  - mkdir -p $HOME/ssh-test
  - rm -f $HOME/ssh-test/maint_runner.sh
  - rm -f $HOME/ssh-test/maint_execution.log
instructions: '1. Create directory `$HOME/ssh-test`.
2. Create an executable script `$HOME/ssh-test/maint_runner.sh` that iterates through hosts `web1`, `web2`, and `web3`, writing `MAINTENANCE_COMPLETE: <host>` for each into `$HOME/ssh-test/maint_execution.log`.
3. Ensure the script has executable permissions (`chmod +x`).'
version: 3
