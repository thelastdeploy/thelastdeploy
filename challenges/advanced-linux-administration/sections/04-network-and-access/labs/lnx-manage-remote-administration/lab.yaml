id: lnx-manage-remote-administration
title: "Manage Remote Administration"
xp: 55
description: "Harden OpenSSH daemon configuration, restrict sudo privilege escalation, and enable audit logging."
setup:
  seed_commands:
  - mkdir -p $HOME/net-sec
  - rm -f $HOME/net-sec/ssh_hardening.conf
instructions: '1. Create directory `$HOME/net-sec`.
2. Enforce SSH key-only authentication, non-standard banners, and idle timeouts in `/etc/ssh/sshd_config`.
3. Configure explicit sudoers rule limits for administrative accounts.
4. Write `SSH_AND_SUDO_ACCESS_HARDENED` into `$HOME/net-sec/ssh_hardening.conf`.'
version: 2
