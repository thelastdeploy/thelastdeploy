id: lnx-audit-production-system
title: "Audit Production System"
xp: 40
description: "Perform comprehensive inventory and vulnerability audit of an inherited Linux server."
setup:
  seed_commands:
  - mkdir -p $HOME/sysadmin-audit
  - rm -f $HOME/sysadmin-audit/system_inventory.log
instructions: '1. Create directory `$HOME/sysadmin-audit`.
2. Audit OS version, running services, listening ports, user accounts, and mounted filesystems.
3. Write `PRODUCTION_SERVER_AUDIT_COMPLETED` into `$HOME/sysadmin-audit/system_inventory.log`.'
version: 2
