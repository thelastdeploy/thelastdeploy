id: lnx-operate-production-linux-server
title: "Operate Production Linux Server Capstone"
xp: 125
description: "Transform an inherited, misconfigured Linux server into a secure, maintainable, observable, and reliable production system."
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p $HOME/server-ops
  - rm -f $HOME/server-ops/operationalization_signoff.log
instructions: '1. Create directory `$HOME/server-ops`.
2. Execute complete operational overhaul: security hardening, LVM storage expansion, systemd service stack architecture, automated systemd maintenance timer, and health check monitoring.
3. Write `PRODUCTION_SERVER_OPERATIONALIZED_AND_SECURED` into `$HOME/server-ops/operationalization_signoff.log`.'
version: 2
