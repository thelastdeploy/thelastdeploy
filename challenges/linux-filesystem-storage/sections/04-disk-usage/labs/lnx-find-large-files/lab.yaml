id: lnx-find-large-files
title: Locate space-consuming files in log directories
xp: 25
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - rm -rf $HOME/disk-test
  - mkdir -p $HOME/disk-test/logs
  - fallocate -l 1M $HOME/disk-test/logs/app.log
  - fallocate -l 5M $HOME/disk-test/logs/small_archive.tar
  - fallocate -l 25M $HOME/disk-test/logs/heavy_dump.log
  - fallocate -l 2M $HOME/disk-test/logs/error.log
version: 3
