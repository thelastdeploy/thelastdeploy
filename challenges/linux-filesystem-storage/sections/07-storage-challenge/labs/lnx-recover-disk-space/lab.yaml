id: lnx-recover-disk-space
title: Recover disk space by clearing stale log archives
xp: 50
setup:
  seed_commands:
  - rm -rf $HOME/storage-challenge
  - mkdir -p $HOME/storage-challenge/archives
  - echo 'Active production log stream' > $HOME/storage-challenge/active_app.log
  - echo 'Active service log stream' > $HOME/storage-challenge/active_service.log
  - truncate -s 100M $HOME/storage-challenge/archives/crash_2025.dump
  - truncate -s 50M $HOME/storage-challenge/archives/old_logs.tar.gz
version: 2
