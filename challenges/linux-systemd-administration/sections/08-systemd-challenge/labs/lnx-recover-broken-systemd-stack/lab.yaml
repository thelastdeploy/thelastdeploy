id: lnx-recover-broken-systemd-stack
title: Recover Broken systemd Service Stack
xp: 70
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p $HOME/systemd-challenge
  - rm -f $HOME/systemd-challenge/*.service
instructions: '1. Create directory `$HOME/systemd-challenge`.
2. Create `$HOME/systemd-challenge/db.service` with `[Unit]`, and `[Service]` containing `Type=simple` and `ExecStart=/bin/echo DB Ready`.
3. Create `$HOME/systemd-challenge/app.service` with `[Unit]` containing `Requires=db.service` and `After=db.service`, and `[Service]` containing `ExecStart=/bin/echo App Ready`.'
version: 2
