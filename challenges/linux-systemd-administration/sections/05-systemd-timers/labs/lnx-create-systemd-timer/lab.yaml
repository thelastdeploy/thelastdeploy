id: lnx-create-systemd-timer
title: Create a systemd Timer Unit
xp: 35
setup:
  seed_commands:
  - mkdir -p $HOME/timer-test
  - rm -f $HOME/timer-test/maint.service $HOME/timer-test/maint.timer
instructions: '1. Create directory `$HOME/timer-test`.
2. Create service unit `$HOME/timer-test/maint.service` containing `[Unit]`, and `[Service]` with `Type=oneshot` and `ExecStart=/bin/echo Maint`.
3. Create matching timer unit `$HOME/timer-test/maint.timer` containing `[Unit]`, `[Timer]` with `OnCalendar=daily` and `Persistent=true`, and `[Install]` with `WantedBy=timers.target`.'
version: 2
