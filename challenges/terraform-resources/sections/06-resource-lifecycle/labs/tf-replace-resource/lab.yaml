id: tf-replace-resource
title: Configure Resource replacement lifecycle
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-resources-challenge
    - mkdir -p $HOME/terraform-resources-challenge
    - echo 'resource "local_file" "example" {' > $HOME/terraform-resources-challenge/main.tf
    - echo '  content  = "Lifecycle test"' >> $HOME/terraform-resources-challenge/main.tf
    - echo '  filename = "/tmp/lifecycle.txt"' >> $HOME/terraform-resources-challenge/main.tf
    - echo '}' >> $HOME/terraform-resources-challenge/main.tf
version: 2
