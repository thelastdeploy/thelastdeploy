id: tf-update-resource
title: Update Resource Arguments
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-resources-challenge
    - mkdir -p $HOME/terraform-resources-challenge
    - echo 'resource "local_file" "app" {' > $HOME/terraform-resources-challenge/main.tf
    - echo '  content = "v1"' >> $HOME/terraform-resources-challenge/main.tf
    - echo '  filename = "/tmp/app.txt"' >> $HOME/terraform-resources-challenge/main.tf
    - echo '}' >> $HOME/terraform-resources-challenge/main.tf
version: 2
