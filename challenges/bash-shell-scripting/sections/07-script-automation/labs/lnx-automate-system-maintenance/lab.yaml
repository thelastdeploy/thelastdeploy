id: lnx-automate-system-maintenance
title: Automate System Maintenance and Logging
xp: 40
setup:
  seed_commands:
  - mkdir -p $HOME/script-test/active_logs
  - echo 'active stream' > $HOME/script-test/active_logs/current.log
  - echo 'obsolete log' > $HOME/script-test/active_logs/stale.old
  - rm -f $HOME/script-test/clean_old_logs.sh
  - rm -f $HOME/script-test/maintenance.log
