id: lnx-analyze-cpu-contention
title: Analyze CPU Scheduler Contention
xp: 40
setup:
  seed_commands:
  - mkdir -p $HOME/cpu-opt-test
  - rm -f $HOME/cpu-opt-test/contention_analysis.txt
instructions: '1. Create directory `$HOME/cpu-opt-test`.
2. Inspect CPU thread contention, context switching rates, and NUMA node statistics (`numastat`, `mpstat`).
3. Write output summary line `CPU_CONTENTION_ANALYZED` to `$HOME/cpu-opt-test/contention_analysis.txt`.'
version: 1
