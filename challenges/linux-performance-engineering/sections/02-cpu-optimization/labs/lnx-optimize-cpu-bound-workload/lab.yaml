id: lnx-optimize-cpu-bound-workload
title: Optimize CPU-Bound Workload Execution
xp: 55
setup:
  seed_commands:
  - mkdir -p $HOME/cpu-opt-test
  - rm -f $HOME/cpu-opt-test/cpu_optimization.txt
instructions: '1. Create directory `$HOME/cpu-opt-test`.
2. Apply CPU core affinity masking (`taskset -c`) and NUMA policy tuning (`numactl`).
3. Write optimization report line `CPU_WORKLOAD_OPTIMIZED` to `$HOME/cpu-opt-test/cpu_optimization.txt`.'
version: 1
