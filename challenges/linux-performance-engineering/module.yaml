id: linux-performance-engineering
title: "Linux Performance Engineering"
description: "Master Linux performance engineering and workload optimization methodologies: workload performance modeling, SLA targets & throughput baselines, CPU scheduler tuning & affinity (taskset, numactl, cgroups), memory allocator tuning & page cache optimization (sysctl vm.*), storage I/O scheduler & queue tuning (bfq, kyber, nvme, iostat), kernel sysctl tuneables & network stack optimization, benchmark validation (sysbench, fio), and production multi-subsystem workload optimization capstone."
