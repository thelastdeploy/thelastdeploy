id: lnx-passwordless-login
title: "Setup passwordless login to localhost"
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "mkdir -p /run/sshd"
    - "systemctl start ssh.socket >/dev/null 2>&1 || systemctl start ssh >/dev/null 2>&1 || service ssh start >/dev/null 2>&1 || /usr/sbin/sshd >/dev/null 2>&1 || true"
    - "rm -rf $HOME/.ssh"
version: 2
