id: lnx-debug-service-connectivity
title: Debug Service Connectivity
summary: Identify why remote users cannot connect to an application bound only to
  localhost.
xp: 30
duration_minutes: 15
difficulty: intermediate
order: 1
instructions: '

  1. Inspect `$HOME/net-test/service_debug/app.conf`.

  2. Change `BIND_ADDRESS="127.0.0.1"` to `BIND_ADDRESS="0.0.0.0"` so the service
  listens on all network interfaces.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/net-test/service_debug'
  - '"printf ''%s'
  - '"printf ''%s'
version: 2
