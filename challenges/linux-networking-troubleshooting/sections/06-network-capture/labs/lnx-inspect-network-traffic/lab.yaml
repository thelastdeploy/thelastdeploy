id: lnx-inspect-network-traffic
title: Inspect Network Traffic
summary: Analyze a tcpdump capture log to identify client IP and flag states.
xp: 45
duration_minutes: 20
difficulty: intermediate
order: 1
instructions: '

  1. Inspect `$HOME/net-test/capture/tcpdump.log`.

  2. Identify the client source IP initiating the TCP handshake (`Flags [S]`).

  3. Write the client IP address (`192.168.1.50`) into `$HOME/net-test/client_ip.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/net-test/capture'
  - '"printf ''%s'
