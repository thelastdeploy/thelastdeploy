id: lnx-investigate-listening-services
title: Investigate Listening Services
summary: Identify which process PID is listening on port 8080 from socket output.
xp: 30
duration_minutes: 15
difficulty: intermediate
order: 1
instructions: '

  1. Inspect `$HOME/net-test/sockets/ss_output.txt`.

  2. Identify the process name and PID listening on port `8080`.

  3. Write the PID of the listening process (`4251`) into `$HOME/net-test/port_8080_pid.txt`.

  '
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p '$HOME/net-test/sockets'
  - "printf 'Netid State  Recv-Q Send-Q Local Address:Port  Peer Address:Port Process\\ntcp   LISTEN 0      128    0.0.0.0:22          0.0.0.0:*         users:((\"sshd\",pid=1102,fd=3))\\ntcp   LISTEN 0      511    0.0.0.0:8080        0.0.0.0:*         users:((\"nginx\",pid=4251,fd=6))\\n' > $HOME/net-test/sockets/ss_output.txt"
version: 2
