id: lnx-recover-broken-connectivity
title: Recover Broken Connectivity
summary: Diagnose and repair misconfigured DNS resolver settings and service port
  bindings in an incident scenario.
xp: 60
duration_minutes: 30
difficulty: intermediate
order: 1
instructions: '

  1. Inspect `$HOME/net-challenge/config/server.env`. Update `LISTEN_IP="127.0.0.1"`
  to `LISTEN_IP="0.0.0.0"`.

  2. Inspect `$HOME/net-challenge/config/resolv.conf`. Ensure it contains `nameserver
  8.8.8.8` (replace or add line).

  3. Update `$HOME/net-challenge/status/app.status` to contain exactly `CONNECTIVITY:
  RESTORED`.

  '
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p '$HOME/net-challenge/config'
  - mkdir -p '$HOME/net-challenge/status'
  - "printf 'nameserver 1.1.1.1\\n' > $HOME/net-challenge/config/resolv.conf"
  - "printf 'LISTEN_IP=\"127.0.0.1\"\\nLISTEN_PORT=8080\\n' > $HOME/net-challenge/config/server.env"
  - "printf 'CONNECTIVITY: FAILED\\n' > $HOME/net-challenge/status/app.status"
version: 2
