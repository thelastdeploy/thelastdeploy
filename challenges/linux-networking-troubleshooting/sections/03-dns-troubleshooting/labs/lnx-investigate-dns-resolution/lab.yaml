id: lnx-investigate-dns-resolution
title: Investigate DNS Resolution
summary: Query a simulated DNS record output to identify resolved IPv4 addresses.
xp: 25
duration_minutes: 15
difficulty: intermediate
order: 1
instructions: '

  1. Inspect the DNS query log in `$HOME/net-test/dns/dig_output.txt`.

  2. Identify the resolved IP address for `internal.service.local`.

  3. Save the resolved IP (`10.250.0.15`) into `$HOME/net-test/resolved_ip.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/net-test/dns'
  - '"printf ''%s'
