id: lnx-debug-namespace-isolation
title: Debug Namespace Isolation Issues
xp: 50
setup:
  seed_commands:
  - mkdir -p $HOME/ns-test
  - rm -f $HOME/ns-test/ns_debug.txt
instructions: '1. Create directory `$HOME/ns-test`.
2. Troubleshoot namespace isolation problems (unshared mount points, hostname leakage).
3. Write diagnosis output line `NAMESPACE_ISOLATION_DEBUGGED` to `$HOME/ns-test/ns_debug.txt`.'
version: 1
