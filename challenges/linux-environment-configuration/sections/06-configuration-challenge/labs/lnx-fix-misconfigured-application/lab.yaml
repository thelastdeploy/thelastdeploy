id: lnx-fix-misconfigured-application
title: Fix Misconfigured Application and Environment
xp: 50
setup:
  seed_commands:
  - mkdir -p $HOME/config-challenge
  - printf 'DB_HOST=localhost_invalid\nPORT=0\n' > $HOME/config-challenge/app.conf
  - printf 'APP_KEY=secret_key_123\n' > $HOME/config-challenge/.env.template
  - rm -f $HOME/config-challenge/.env
  - rm -f $HOME/config-challenge/fix_report.txt
