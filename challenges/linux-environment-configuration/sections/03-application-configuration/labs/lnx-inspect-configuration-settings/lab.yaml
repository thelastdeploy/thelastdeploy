id: lnx-inspect-configuration-settings
title: Inspect Active Configuration Settings
xp: 25
setup:
  seed_commands:
  - mkdir -p $HOME/env-test
  - printf '# Default HTTP Port\n# PORT=80\nPORT=8080\n# Max Workers\nWORKERS=4\n'
    > $HOME/env-test/web.conf
  - rm -f $HOME/env-test/active_settings.txt
