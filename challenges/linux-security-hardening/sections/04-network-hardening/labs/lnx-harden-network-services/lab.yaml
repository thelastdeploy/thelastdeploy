id: lnx-harden-network-services
title: Harden Network Services and SSH
xp: 35
setup:
  seed_commands:
  - mkdir -p $HOME/net-sec-test
  - rm -f $HOME/net-sec-test/sshd_summary.txt
instructions: '1. Create directory `$HOME/net-sec-test`.
2. Document SSH hardening parameters (`PermitRootLogin no`, `PasswordAuthentication no`).
3. Write output summary `SSHD_CONFIG_HARDENED` to `$HOME/net-sec-test/sshd_summary.txt`.'
version: 1
