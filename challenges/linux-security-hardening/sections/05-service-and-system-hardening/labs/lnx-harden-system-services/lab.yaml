id: lnx-harden-system-services
title: Harden systemd Services with Sandboxing
xp: 40
setup:
  seed_commands:
  - mkdir -p $HOME/svc-sec-test
  - rm -f $HOME/svc-sec-test/sandboxing.txt
instructions: '1. Create directory `$HOME/svc-sec-test`.
2. Document systemd security directives (`NoNewPrivileges=true`, `ProtectSystem=strict`, `PrivateTmp=yes`).
3. Write output summary line `SERVICE_SANDBOXING_HARDENED` to `$HOME/svc-sec-test/sandboxing.txt`.'
version: 1
