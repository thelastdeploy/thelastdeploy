id: lnx-identify-security-weaknesses
title: Identify System Security Weaknesses
xp: 35
setup:
  seed_commands:
  - mkdir -p $HOME/sec-test
  - rm -f $HOME/sec-test/weaknesses.txt
instructions: '1. Create directory `$HOME/sec-test`.
2. Identify security weaknesses (unsecured permissions, open ports, weak credentials).
3. Write output line `WEAKNESSES_IDENTIFIED` into `$HOME/sec-test/weaknesses.txt`.'
version: 1
