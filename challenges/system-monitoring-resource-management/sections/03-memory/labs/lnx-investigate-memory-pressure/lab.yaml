id: lnx-investigate-memory-pressure
title: Investigate Memory Pressure
summary: Identify the process terminated by kernel OOM killer from dmesg logs.
xp: 35
duration_minutes: 20
difficulty: intermediate
order: 2
instructions: '

  1. Inspect `$HOME/mon-test/oom/dmesg_oom.log`.

  2. Identify the process name killed by the kernel OOM killer (`java_backend`).

  3. Write the killed process name (`java_backend`) into `$HOME/mon-test/oom_process.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/mon-test/oom'
  - '"printf ''%s'
version: 2
