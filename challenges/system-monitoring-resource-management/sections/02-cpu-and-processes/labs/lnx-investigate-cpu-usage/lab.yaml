id: lnx-investigate-cpu-usage
title: Investigate CPU Usage
summary: Identify user space CPU utilization percentage from top output.
xp: 25
duration_minutes: 15
difficulty: intermediate
order: 1
instructions: '

  1. Inspect `$HOME/mon-test/cpu/top_snapshot.txt`.

  2. Locate the user space CPU percentage (`us`).

  3. Write the numerical percentage (`85.2`) into `$HOME/mon-test/user_cpu.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/mon-test/cpu'
  - '"printf ''%s'
