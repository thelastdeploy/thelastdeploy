id: lnx-investigate-io-bottleneck
title: Investigate I/O Bottleneck
summary: Identify process PID generating excessive write IOPS from iotop log.
xp: 40
duration_minutes: 20
difficulty: intermediate
order: 2
instructions: '

  1. Inspect `$HOME/mon-test/iotop/iotop_log.txt`.

  2. Locate the process causing high disk write I/O (`85.40 M/s`).

  3. Write its PID (`6891`) into `$HOME/mon-test/io_hog_pid.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/mon-test/iotop'
  - '"printf ''%s'
