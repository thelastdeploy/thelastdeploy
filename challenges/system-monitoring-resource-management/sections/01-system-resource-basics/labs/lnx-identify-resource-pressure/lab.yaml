id: lnx-identify-resource-pressure
title: Identify Resource Pressure
summary: Identify which resource metric is under pressure from vmstat output.
xp: 25
duration_minutes: 15
difficulty: intermediate
order: 2
instructions: '

  1. Inspect `$HOME/mon-test/pressure/vmstat.log`.

  2. Examine CPU columns (`us`, `sy`, `id`, `wa`). Notice `wa` (iowait) is at 70%.

  3. Save the pressure metric type (`iowait`) into `$HOME/mon-test/bottleneck.txt`.

  '
setup:
  seed_commands:
  - mkdir -p '$HOME/mon-test/pressure'
  - '"printf ''%s'
version: 2
