id: tf-show-state
title: Show Details of a State Resource
xp: 15
estimated_minutes: 4
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-state-challenge
    - mkdir -p $HOME/terraform-state-challenge
    - echo 'resource "local_file" "secret" {' > $HOME/terraform-state-challenge/main.tf
    - echo '  content  = "hidden_value"' >> $HOME/terraform-state-challenge/main.tf
    - echo '  filename = "/tmp/secret.txt"' >> $HOME/terraform-state-challenge/main.tf
    - echo '}' >> $HOME/terraform-state-challenge/main.tf
    - cd $HOME/terraform-state-challenge && terraform init && terraform apply -auto-approve
version: 2
