id: tf-fix-state
title: Reconcile Drifting Infrastructure
xp: 30
estimated_minutes: 8
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-state-challenge
    - mkdir -p $HOME/terraform-state-challenge
    - echo 'resource "local_file" "recovery" {' > $HOME/terraform-state-challenge/main.tf
    - echo '  content  = "expected_state"' >> $HOME/terraform-state-challenge/main.tf
    - echo '  filename = "/tmp/recovery.txt"' >> $HOME/terraform-state-challenge/main.tf
    - echo '}' >> $HOME/terraform-state-challenge/main.tf
    - cd $HOME/terraform-state-challenge && terraform init && terraform apply -auto-approve
    - rm -f /tmp/recovery.txt
version: 2
