id: lnx-investigate-failed-service
title: Investigate Failed Service Crash Logs
xp: 40
setup:
  seed_commands:
  - mkdir -p $HOME/log-test
  - printf '[INFO] Starting postgresql.service...\n[FATAL] Port 5432 already in use
    by process 2104\n[ERROR] Failed to start server daemon\n' > $HOME/log-test/failed_service_journal.log
  - rm -f $HOME/log-test/service_root_cause.txt
