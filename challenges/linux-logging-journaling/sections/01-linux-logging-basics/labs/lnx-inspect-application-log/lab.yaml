id: lnx-inspect-application-log
title: Inspect Application Log Streams
xp: 25
environment:
  profile: tld-ubuntu
setup:
  seed_commands:
  - mkdir -p $HOME/log-test/app_logs
  - seq 1 30 | sed 's/^/192.168.1.1 GET \/item\//' > $HOME/log-test/app_logs/web_access.log
  - rm -f $HOME/log-test/recent_access.log
version: 3
