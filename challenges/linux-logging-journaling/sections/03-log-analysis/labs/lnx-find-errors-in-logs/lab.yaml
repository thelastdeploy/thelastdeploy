id: lnx-find-errors-in-logs
title: Extract Errors and Fatal Exceptions from Logs
xp: 25
setup:
  seed_commands:
  - mkdir -p $HOME/log-test
  - printf '[INFO] Server started\n[ERROR] Connection timeout\n[INFO] Request processed\n[FATAL]
    Out of memory\n' > $HOME/log-test/app.log
  - rm -f $HOME/log-test/error_summary.log
