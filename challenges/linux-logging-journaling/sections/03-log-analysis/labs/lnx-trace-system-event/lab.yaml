id: lnx-trace-system-event
title: "Trace System Event Timelines across Logs"
xp: 35
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "mkdir -p $HOME/log-test"
    - "printf '10:00:01 session_id=1041 INIT\n10:00:02 session_id=1042 INIT\n10:00:03 session_id=1041 PROCESS\n10:00:04 session_id=1042 PAYLOAD_FAIL\n10:00:05 session_id=1042 TERMINATED\n' > $HOME/log-test/system_trace.log"
    - "rm -f $HOME/log-test/session_1042_trace.log"
version: 1
