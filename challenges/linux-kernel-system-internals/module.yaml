id: linux-kernel-system-internals
title: "Kernel & System Internals"
description: "Explore the Linux kernel subsystem interfaces from userspace: procfs, sysfs, process scheduler internals (CFS/EEVDF, task_struct, state transitions), virtual memory management (page tables, page faults, anonymous vs file-backed mappings, slab allocator), VFS (Virtual File System) abstraction & inode operations, kernel modules & device drivers (sysfs attributes, character/block interfaces), kernel tracing & observability (ftrace, tracepoints, perf, kprobes), and deep kernel-level failure root-cause analysis."
