id: tf-remove-hardcoding
title: Refactor Hardcoded Configuration
xp: 30
estimated_minutes: 10
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-expr-challenge
    - mkdir -p $HOME/terraform-expr-challenge
    - echo 'resource "local_file" "f1" {' > $HOME/terraform-expr-challenge/main.tf
    - echo '  content  = "hardcoded_value_123"' >> $HOME/terraform-expr-challenge/main.tf
    - echo '  filename = "/tmp/hardcoded.txt"' >> $HOME/terraform-expr-challenge/main.tf
    - echo '}' >> $HOME/terraform-expr-challenge/main.tf
version: 2
