id: tf-default-values
title: Define Variable Default Values
xp: 15
estimated_minutes: 4
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-expr-challenge
    - mkdir -p $HOME/terraform-expr-challenge
    - echo 'variable "app_name" {' > $HOME/terraform-expr-challenge/main.tf
    - echo '  type = string' >> $HOME/terraform-expr-challenge/main.tf
    - echo '}' >> $HOME/terraform-expr-challenge/main.tf
version: 2
