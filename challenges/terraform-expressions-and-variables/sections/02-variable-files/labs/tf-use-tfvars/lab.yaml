id: tf-use-tfvars
title: Use a terraform.tfvars File
xp: 20
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/terraform-expr-challenge
    - mkdir -p $HOME/terraform-expr-challenge
    - echo 'variable "filename" { type = string }' > $HOME/terraform-expr-challenge/main.tf
    - echo 'resource "local_file" "out" {' >> $HOME/terraform-expr-challenge/main.tf
    - echo '  content  = "hello"' >> $HOME/terraform-expr-challenge/main.tf
    - echo '  filename = var.filename' >> $HOME/terraform-expr-challenge/main.tf
    - echo '}' >> $HOME/terraform-expr-challenge/main.tf
version: 2
