id: nginx-optimize-production-config
title: "Optimize Production Configuration"
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true"
    # Seed sub-optimal variables (double escaped backslashes)
    - "sudo sed -i 's/worker_processes .*/worker_processes 1;/' /etc/nginx/nginx.conf"
    - "sudo sed -i '/http {/a \\    keepalive_timeout 300;' /etc/nginx/nginx.conf"
    - "sudo systemctl start nginx || true"
    - "sudo systemctl reload nginx || true"
version: 2
