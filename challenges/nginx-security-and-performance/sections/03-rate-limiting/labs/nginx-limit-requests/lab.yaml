id: nginx-limit-requests
title: "Limit Request Rate"
xp: 25
estimated_minutes: 5
environment:
  profile: tld-ubuntu
setup:
  type: shell
  seed_commands:
    - "which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)"
    - "sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true"
    - "sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak || true"
    # Inject api location block to default if not present
    - "sudo sed -i '/location \\/api/,+3d' /etc/nginx/sites-available/default || true"
    - 'sudo python3 -c "p=\"/etc/nginx/sites-available/default\"; c=open(p).read(); open(p,\"w\").write(c.replace(\"server_name _;\", \"server_name _;\\n    location /api/ {\\n        root /var/www/html;\\n    }\"))"'
    - "sudo systemctl start nginx || true"
    - "sudo systemctl restart nginx || true"
version: 2
