id: lnx-analyze-disk-io
title: Analyze Disk I/O Utilization and Latency
xp: 30
setup:
  seed_commands:
  - mkdir -p $HOME/io-perf-test
  - rm -f $HOME/io-perf-test/io_analysis.txt
instructions: '1. Create directory `$HOME/io-perf-test`.
2. Inspect storage device throughput (`IOPS`), latency (`await`), and utilization (`%util`) using `iostat -xz 1`.
3. Write output summary line `DISK_IO_ANALYZED` to `$HOME/io-perf-test/io_analysis.txt`.'
version: 1
